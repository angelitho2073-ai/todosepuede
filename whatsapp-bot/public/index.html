<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel WhatsApp</title>
<style>
  :root { --bg:#f4f6f5; --card:#fff; --ink:#1d2a24; --muted:#66756d; --line:#dfe5e2; --brand:#128c4a; --brand-ink:#fff; --warn:#b26a00; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101614; --card:#18201d; --ink:#e6ede9; --muted:#93a39a; --line:#2a3530; --brand:#25b061; --brand-ink:#04140b; --warn:#f0a83a; --err:#ff8a80; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; flex:1; }
  nav button { background:none; border:0; padding:8px 10px; color:var(--muted); font:inherit; cursor:pointer; border-radius:8px; }
  nav button.on { color:var(--ink); background:var(--bg); font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .stat b { display:block; font-size:24px; }
  .stat span { color:var(--muted); font-size:13px; }
  .layout { display:grid; grid-template-columns:minmax(260px,360px) 1fr; gap:16px; }
  @media (max-width:760px) { .layout { grid-template-columns:1fr; } }
  .list { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .item { padding:12px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:last-child { border-bottom:0; }
  .item.on, .item:hover { background:var(--bg); }
  .item small { color:var(--muted); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; min-height:200px; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:var(--bg); border:1px solid var(--line); }
  .b-en_revision { color:var(--brand); border-color:var(--brand); }
  .b-pendiente_pago { color:var(--warn); border-color:var(--warn); }
  .b-error { color:var(--err); border-color:var(--err); }
  textarea, input, select { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  textarea { min-height:280px; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  button.btn { background:var(--brand); color:var(--brand-ink); border:0; padding:9px 14px; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  button.sec { background:var(--bg); color:var(--ink); border:1px solid var(--line); }
  button.dan { background:none; color:var(--err); border:1px solid var(--err); }
  .msgs { display:flex; flex-direction:column; gap:6px; max-height:55vh; overflow:auto; padding:4px; }
  .m { max-width:80%; padding:8px 10px; border-radius:10px; white-space:pre-wrap; }
  .m.cliente { background:var(--bg); align-self:flex-start; }
  .m.bot, .m.humano { background:color-mix(in srgb,var(--brand) 18%,var(--card)); align-self:flex-end; }
  .m small { display:block; color:var(--muted); font-size:11px; }
  .muted { color:var(--muted); }
  pre { white-space:pre-wrap; background:var(--bg); padding:10px; border-radius:8px; }
  #login { max-width:360px; margin:15vh auto; background:var(--card); padding:20px; border-radius:12px; border:1px solid var(--line); }
  .hide { display:none !important; }
</style>
</head>
<body>
<div id="login">
  <h2 style="margin-top:0">Panel del negocio</h2>
  <p class="muted">Ingresa tu ADMIN_TOKEN (el que pusiste en el archivo .env).</p>
  <input id="tok" type="password" placeholder="Token de administrador">
  <div class="row"><button class="btn" onclick="login()">Entrar</button></div>
</div>

<div id="app" class="hide">
  <header>
    <h1>📲 WhatsApp + Claude</h1>
    <nav>
      <button data-tab="conexion">Conexión</button>
      <button data-tab="pedidos" class="on">Pedidos</button>
      <button data-tab="chats">Chats</button>
      <button data-tab="catalogo">Precios</button>
    </nav>
  </header>
  <main>
    <div class="stats" id="stats"></div>

    <section id="t-conexion" class="hide">
      <div class="panel" id="cx" style="text-align:center"></div>
    </section>

    <section id="t-pedidos">
      <div class="row"><select id="filtro" style="max-width:240px" onchange="cargarPedidos()">
        <option value="">Todos los pedidos</option>
        <option value="en_revision">Para revisar</option>
        <option value="pendiente_pago">Esperando pago</option>
        <option value="en_cola">En cola</option>
        <option value="en_progreso">En elaboración</option>
        <option value="entregado">Entregados</option>
        <option value="error">Con error</option>
      </select></div>
      <div class="layout"><div class="list" id="lp"></div><div class="panel" id="dp"><p class="muted">Elige un pedido.</p></div></div>
    </section>

    <section id="t-chats" class="hide">
      <div class="layout"><div class="list" id="lc"></div><div class="panel" id="dc"><p class="muted">Elige un chat.</p></div></div>
    </section>

    <section id="t-catalogo" class="hide">
      <div class="panel">
        <p class="muted">Edita tus servicios y precios (formato JSON). El bot usa esto para cotizar.</p>
        <textarea id="cat" style="min-height:420px;font-family:ui-monospace,monospace;font-size:13px"></textarea>
        <div class="row"><button class="btn" onclick="guardarCatalogo()">Guardar precios</button></div>
      </div>
    </section>
  </main>
</div>

<script>
const ESTADOS = { pendiente_pago:"Esperando pago", en_cola:"En cola", en_progreso:"Claude trabajando…", en_revision:"Listo para revisar", entregado:"Entregado", error:"Error", cancelado:"Cancelado" };
let TOKEN = ""; try { TOKEN = localStorage.getItem("adm") || ""; } catch {}
let sel = null, selChat = null, moneda = "S/";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, { ...opts, headers: { "Content-Type":"application/json", Authorization:"Bearer " + TOKEN }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { salir(); throw new Error("No autorizado"); }
  if (!r.ok) { alert(j.error || "Error"); throw new Error(j.error); }
  return j;
}
function login() { TOKEN = $("tok").value.trim(); try { localStorage.setItem("adm", TOKEN); } catch {} iniciar(); }
function salir() { $("app").classList.add("hide"); $("login").classList.remove("hide"); }

async function iniciar() {
  try { await resumen(); } catch { return; }
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  cargarPedidos();
  const c = await api("/conexion");
  if (c.modo === "qr" && !c.conectado) document.querySelector('[data-tab="conexion"]').click();
  avisoConexion(c);
}

function avisoConexion(c) {
  const b = document.querySelector('[data-tab="conexion"]');
  b.textContent = c.conectado ? "🟢 Conexión" : "🔴 Conexión";
}

let cxTimer = null;
async function conexion() {
  clearTimeout(cxTimer);
  const c = await api("/conexion"); avisoConexion(c);
  const visible = !$("t-conexion").classList.contains("hide");
  if (c.modo === "api") {
    $("cx").innerHTML = `<h3>Conectado con la API oficial de Meta</h3><p class="muted">Los mensajes llegan por el webhook. Para usar QR pon WHATSAPP_MODO=qr en .env.</p>`;
  } else if (c.conectado) {
    $("cx").innerHTML = `<h3>🟢 WhatsApp conectado</h3><p>${esc(c.nombre || "")} +${esc(c.numero || "")}</p>
      <p class="muted">Tu asistente está respondiendo. Tu celular sigue funcionando normal: si escribes tú a un cliente, el bot se pausa en ese chat por unas horas.</p>
      <button class="dan btn" onclick="desconectar()">Desvincular WhatsApp</button>`;
  } else {
    $("cx").innerHTML = `<h3>Vincula tu WhatsApp</h3>
      ${c.error ? `<p style="color:var(--err)">${esc(c.error)}</p>` : ""}
      <ol style="text-align:left;max-width:420px;margin:0 auto 12px">
        <li>Abre WhatsApp (o WhatsApp Business) en tu celular.</li>
        <li>Toca <b>⋮ Menú</b> o <b>Configuración</b> → <b>Dispositivos vinculados</b> → <b>Vincular un dispositivo</b>.</li>
        <li>Apunta la cámara a este código.</li>
      </ol>
      ${c.qr ? `<img src="${c.qr}" alt="Código QR" style="width:280px;max-width:100%;background:#fff;padding:8px;border-radius:12px">` : `<p class="muted">Generando código QR…</p>`}
      <p class="muted" style="margin-top:16px">¿Estás en el mismo celular y no puedes escanear? Usa un código:</p>
      <div class="row" style="justify-content:center"><input id="pnum" placeholder="Tu número con código de país, ej. 51987654321" style="max-width:300px"><button class="sec btn" onclick="pedirCodigo()">Obtener código</button></div>
      <p id="pcod" style="font-size:28px;letter-spacing:4px;font-weight:700"></p>`;
  }
  if (visible || !c.conectado) cxTimer = setTimeout(conexion, c.conectado ? 15000 : 4000);
}
async function pedirCodigo() {
  const { codigo } = await api("/conexion/codigo", { method:"POST", body:{ numero:$("pnum").value } });
  clearTimeout(cxTimer);
  $("pcod").innerHTML = esc(codigo) + `<br><span class="muted" style="font-size:14px;letter-spacing:0;font-weight:400">En WhatsApp: Dispositivos vinculados → Vincular un dispositivo → <b>Vincular con número de teléfono</b> y escribe este código.</span>`;
  cxTimer = setTimeout(conexion, 30000);
}
async function desconectar() { if (confirm("¿Desvincular? El bot dejará de responder hasta que escanees de nuevo.")) { await api("/conexion/salir", { method:"POST" }); setTimeout(conexion, 2000); } }

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
  ["conexion","pedidos","chats","catalogo"].forEach((t) => $("t-" + t).classList.toggle("hide", t !== b.dataset.tab));
  if (b.dataset.tab === "chats") cargarChats();
  if (b.dataset.tab === "conexion") conexion();
  if (b.dataset.tab === "catalogo") api("/catalogo").then((c) => $("cat").value = JSON.stringify(c, null, 2));
});

async function resumen() {
  const s = await api("/resumen"); moneda = s.moneda;
  $("stats").innerHTML = [["Para revisar",s.en_revision],["Esperando pago",s.pendiente_pago],["En trabajo",s.en_trabajo],["Entregados",s.entregados],["Chats",s.chats]]
    .map(([t,n]) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`).join("");
}

async function cargarPedidos() {
  const lista = await api("/pedidos" + ($("filtro").value ? "?estado=" + $("filtro").value : ""));
  $("lp").innerHTML = lista.map((p) => `<div class="item ${p.id===sel?"on":""}" onclick="verPedido('${p.id}')">
    <b>${esc(p.servicio_nombre)}</b> <span class="badge b-${p.estado}">${ESTADOS[p.estado]}</span>
    <small>${esc(p.cliente || "+" + (p.numero || p.telefono))} · ${moneda}${p.precio_total} · ${esc(p.id)}</small></div>`).join("") || `<div class="item muted">Aún no hay pedidos.</div>`;
}

async function verPedido(id) {
  sel = id; const p = await api("/pedidos/" + id); cargarPedidos();
  const acciones = [];
  if (p.estado === "pendiente_pago") acciones.push(`<input id="adel" type="number" value="${p.precio_total/2}" style="max-width:130px" title="Adelanto recibido"><button class="btn" onclick="pago()">Confirmar pago y empezar</button>`);
  if (["en_revision","entregado","error"].includes(p.estado)) acciones.push(`<button class="sec btn" onclick="rehacer()">Pedir a Claude que lo rehaga</button>`);
  if (p.estado === "en_revision" || (p.estado === "entregado" && p.final)) acciones.push(`<select id="fmt" style="max-width:150px"><option value="auto">Formato automático</option><option value="texto">Como texto</option><option value="docx">Como Word</option></select><button class="btn" onclick="entregar()">${p.estado==="entregado"?"Reenviar":"Aprobar y entregar"}</button>`);
  if (!["entregado","cancelado"].includes(p.estado)) acciones.push(`<button class="dan btn" onclick="cancelar()">Cancelar</button>`);
  $("dp").innerHTML = `
    <h3 style="margin-top:0">${esc(p.servicio_nombre)} <span class="badge b-${p.estado}">${ESTADOS[p.estado]}</span></h3>
    <p class="muted">${esc(p.cliente || "")} · +${esc(p.numero || p.telefono)} · ${moneda}${p.precio_total} · Plazo: ${esc(p.plazo)} ${p.urgente ? "· URGENTE" : ""}</p>
    ${p.pagoReportado && p.estado === "pendiente_pago" ? `<p style="color:var(--warn)">💰 El cliente reportó un pago de ${moneda}${p.pagoReportado.monto}: ${esc(p.pagoReportado.detalle)} (revisa la captura en Chats)</p>` : ""}
    ${p.error ? `<p style="color:var(--err)">⚠️ ${esc(p.error)}</p>` : ""}
    <details><summary>Instrucciones del pedido</summary><pre>${esc(p.descripcion)}</pre></details>
    ${p.notasRevision ? `<p><b>Correcciones pedidas:</b> ${esc(p.notasRevision)}</p>` : ""}
    ${p.final || p.borrador ? `<p><b>Trabajo final</b> <span class="muted">(puedes editarlo antes de entregar)</span></p>
      <textarea id="fin">${esc(p.final || p.borrador)}</textarea>
      <div class="row"><button class="sec btn" onclick="guardarFinal()">Guardar cambios</button></div>` : `<p class="muted">${p.estado==="en_progreso" ? "Claude está trabajando en este pedido…" : "Todavía no hay contenido."}</p>`}
    <div class="row">${acciones.join("")}</div>`;
}
async function pago() { await api(`/pedidos/${sel}/pago`, { method:"POST", body:{ adelanto:Number($("adel").value) } }); refrescar(); }
async function guardarFinal() { await api(`/pedidos/${sel}/editar`, { method:"POST", body:{ final:$("fin").value } }); alert("Guardado"); }
async function rehacer() { const i = prompt("¿Qué debe cambiar Claude? (opcional)"); if (i === null) return; await api(`/pedidos/${sel}/rehacer`, { method:"POST", body:{ instrucciones:i } }); refrescar(); }
async function entregar() {
  if ($("fin")) await api(`/pedidos/${sel}/editar`, { method:"POST", body:{ final:$("fin").value } });
  if (!confirm("¿Enviar este trabajo al cliente por WhatsApp?")) return;
  await api(`/pedidos/${sel}/entregar`, { method:"POST", body:{ formato:$("fmt").value } }); refrescar();
}
async function cancelar() { if (confirm("¿Cancelar este pedido?")) { await api(`/pedidos/${sel}/cancelar`, { method:"POST" }); refrescar(); } }
function refrescar() { resumen(); verPedido(sel); }

async function cargarChats() {
  const lista = await api("/chats");
  $("lc").innerHTML = lista.map((c) => `<div class="item ${encodeURIComponent(c.telefono)===selChat?"on":""}" onclick="verChat('${encodeURIComponent(c.telefono)}')">
    <b>${esc(c.nombre || "+" + c.numero)}</b> ${c.botActivo ? "" : `<span class="badge b-pendiente_pago">Atiendes tú${c.pausaHasta ? " hasta " + new Date(c.pausaHasta).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : ""}</span>`}
    <small>${esc(c.ultimo)}</small></div>`).join("") || `<div class="item muted">Aún no hay conversaciones.</div>`;
}
async function verChat(tel) {
  selChat = tel; const c = await api("/chats/" + tel); cargarChats();
  const img = (m) => m.imagen ? `<img src="/api/media/${encodeURIComponent(m.imagen.archivo)}" data-auth style="max-width:220px;border-radius:8px;display:block;margin:4px 0">` : "";
  $("dc").innerHTML = `
    <h3 style="margin-top:0">${esc(c.nombre || "")} +${esc(c.numero)}</h3>
    <div class="row"><button class="sec btn" onclick="toggleBot(${!c.botActivo})">${c.botActivo ? "⏸ Pausar bot (atender yo)" : "▶️ Reactivar bot"}</button></div>
    <div class="msgs" id="msgs">${c.mensajes.map((m) => `<div class="m ${m.rol}"><small>${{cliente:"Cliente",bot:"Bot",humano:"Tú"}[m.rol]} · ${new Date(m.fecha).toLocaleString()}</small>${img(m)}${esc(m.texto)}</div>`).join("")}</div>
    <div class="row"><input id="txt" placeholder="Escribe al cliente…" onkeydown="if(event.key==='Enter')enviar()"><button class="btn" onclick="enviar()">Enviar</button></div>`;
  cargarImagenes();
  const box = $("msgs"); box.scrollTop = box.scrollHeight;
}
// Las imágenes van protegidas por token: se descargan con fetch.
async function cargarImagenes() {
  for (const im of document.querySelectorAll("img[data-auth]")) {
    const r = await fetch(im.getAttribute("src"), { headers:{ Authorization:"Bearer " + TOKEN } });
    if (r.ok) im.src = URL.createObjectURL(await r.blob());
    im.removeAttribute("data-auth");
  }
}
async function toggleBot(activo) { await api(`/chats/${selChat}/bot`, { method:"POST", body:{ activo } }); verChat(selChat); }
async function enviar() { const t = $("txt").value.trim(); if (!t) return; await api(`/chats/${selChat}/mensaje`, { method:"POST", body:{ texto:t } }); verChat(selChat); }

async function guardarCatalogo() {
  let c; try { c = JSON.parse($("cat").value); } catch { return alert("El JSON tiene un error de formato."); }
  await api("/catalogo", { method:"PUT", body:c }); alert("Precios guardados. El bot ya usa los nuevos precios.");
}

setInterval(() => { if (!$("app").classList.contains("hide")) { resumen(); if (!$("t-pedidos").classList.contains("hide")) cargarPedidos(); } }, 15000);
if (TOKEN) iniciar();
</script>
</body>
</html>
